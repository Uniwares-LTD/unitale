<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1324" viewBox="0 0 1880 1324" role="img" aria-labelledby="title description">
<title id="title">Production lifecycle and revision controls: entities, fields and relationships</title>
<desc id="description">Proposed logical model, not an implemented database schema. Groups show the entities and review fields for this model view. A relationship register specifies cross-group links. Fixed dark text on light backgrounds avoids theme-dependent unreadable rows.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1880" height="1324" fill="#f1f5f9"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="48" fill="#0f172a" font-size="32" font-weight="700">Production lifecycle and revision controls</text>
<text x="36" y="82" fill="#92400e" font-size="20" font-weight="700">PROPOSED DESIGN — under review, not a collection or migration specification</text>
<text x="36" y="112" fill="#172033" font-size="17" font-weight="400">PK = primary identity   FK = reference   ? = optional/nullable   [] = list   1:N arrows show one-to-many ownership</text>
<text x="36" y="138" fill="#172033" font-size="17" font-weight="400">T14: agree persisted boundaries now; T15/T20 implement lifecycle and orchestration later.</text>
<text x="36" y="180" fill="#0f172a" font-size="24" font-weight="700">1. Durable state and concurrency</text>
<text x="36" y="208" fill="#172033" font-size="17" font-weight="400">Candidate persistence fields; no second scheduler and no replacement for existing Run execution state.</text>
<rect x="36" y="228" width="320" height="350" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<path d="M44,228 H348 Q356,228 356,236 V300 H36 V236 Q36,228 44,228Z" fill="#17324d"/>
<text x="50" y="257" fill="#ffffff" font-size="21" font-weight="700">Production lifecycle</text>
<text x="50" y="281" fill="#e2e8f0" font-size="14" font-weight="400">P: refine existing contract</text>
<rect x="37" y="307" width="318" height="24" fill="#eef2f6"/>
<text x="50" y="325" fill="#172033" font-size="16" font-weight="400">id / ownerId / bookletId</text>
<text x="50" y="349" fill="#172033" font-size="16" font-weight="400">orderId / sourceProductionId?</text>
<rect x="37" y="355" width="318" height="24" fill="#eef2f6"/>
<text x="50" y="373" fill="#172033" font-size="16" font-weight="400">lifecycleState</text>
<text x="50" y="397" fill="#172033" font-size="16" font-weight="400">currentManifestRevisionId?</text>
<rect x="37" y="403" width="318" height="24" fill="#eef2f6"/>
<text x="50" y="421" fill="#172033" font-size="16" font-weight="400">version / createdAt / updatedAt</text>
<text x="50" y="445" fill="#172033" font-size="16" font-weight="400">expiresAt? / closedAt?</text>
<rect x="37" y="451" width="318" height="24" fill="#eef2f6"/>
<text x="50" y="469" fill="#172033" font-size="16" font-weight="400">Separate lifecycle from Run status</text>
<rect x="404" y="228" width="320" height="350" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<path d="M412,228 H716 Q724,228 724,236 V300 H404 V236 Q404,228 412,228Z" fill="#17324d"/>
<text x="418" y="257" fill="#ffffff" font-size="21" font-weight="700">Stage lock</text>
<text x="418" y="281" fill="#e2e8f0" font-size="14" font-weight="400">C + P: embedded refinement</text>
<rect x="405" y="307" width="318" height="24" fill="#eef2f6"/>
<text x="418" y="325" fill="#172033" font-size="16" font-weight="400">stage: story, style, references</text>
<text x="418" y="349" fill="#172033" font-size="16" font-weight="400">operationId / lockedAt</text>
<rect x="405" y="355" width="318" height="24" fill="#eef2f6"/>
<text x="418" y="373" fill="#172033" font-size="16" font-weight="400">acceptedSourceRevisionIds[]?</text>
<text x="418" y="397" fill="#172033" font-size="16" font-weight="400">Stored atomically before generation</text>
<rect x="405" y="403" width="318" height="24" fill="#eef2f6"/>
<text x="418" y="421" fill="#172033" font-size="16" font-weight="400">Never reopen on uncertain outcome</text>
<rect x="772" y="228" width="320" height="350" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<path d="M780,228 H1084 Q1092,228 1092,236 V300 H772 V236 Q772,228 780,228Z" fill="#17324d"/>
<text x="786" y="257" fill="#ffffff" font-size="21" font-weight="700">Mutation lease</text>
<text x="786" y="281" fill="#e2e8f0" font-size="14" font-weight="400">P: service-owned fencing</text>
<rect x="773" y="307" width="318" height="24" fill="#eef2f6"/>
<text x="786" y="325" fill="#172033" font-size="16" font-weight="400">productionId</text>
<text x="786" y="349" fill="#172033" font-size="16" font-weight="400">activeRunId / workflow identity</text>
<rect x="773" y="355" width="318" height="24" fill="#eef2f6"/>
<text x="786" y="373" fill="#172033" font-size="16" font-weight="400">leaseOwner / leaseExpiresAt</text>
<text x="786" y="397" fill="#172033" font-size="16" font-weight="400">fencingToken / version</text>
<rect x="773" y="403" width="318" height="24" fill="#eef2f6"/>
<text x="786" y="421" fill="#172033" font-size="16" font-weight="400">Recovery and terminal release rules</text>
<text x="786" y="445" fill="#172033" font-size="16" font-weight="400">One mutation workflow per production</text>
<rect x="1140" y="228" width="320" height="350" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
