      - id: bind-originals
        type: custom
        position:
          x: 60
          y: 1130
        parentId: actions
        extent: parent
        data:
          type: code
          title: bind-originals
          desc: ""
          selected: false
          isInLoop: true
          loop_id: actions
          code_language: python3
          code: |
            import json
            def unpack(raw):
                if isinstance(raw, str):
                    raw = json.loads(raw)
                if isinstance(raw, list):
                    if len(raw) != 1:
                        raise ValueError("Expected one explicit tool result, not an ambiguous wrapper")
                    raw = raw[0]
                if isinstance(raw, dict) and "result" in raw:
                    raw = raw["result"]
                    if isinstance(raw, str):
                        raw = json.loads(raw)
                if not isinstance(raw, dict) or raw.get("error") or raw.get("isError") or raw.get("ok") is False:
                    raise ValueError("Tool failed or result wrapper unsupported")
                return raw

            def main(raw, request, files=None):
                source = unpack(raw)
                r = json.loads(request)
                files = files or []
                expected = r.get("references", [])
                manifest = source.get("references", [])
                if len(files) != len(expected) or len(manifest) != len(expected):
                    raise ValueError("Missing or additional source originals")
                for i, ref in enumerate(expected):
                    if any(ref.get(k) != manifest[i].get(k) for k in ("assetId", "sha256", "bytes")):
                        raise ValueError("Source original changed/order mismatch")
                    native_id = files[i].get("related_id") or files[i].get("id")
                    if not native_id:
                        raise ValueError("Native source handle missing")
                    ref["nativeFileId"] = native_id
                return {"request": json.dumps(r, ensure_ascii=False)}
          variables:
            - variable: raw
              value_selector:
                - originals
                - json
            - variable: files
              value_selector:
                - originals
                - files
            - variable: request
              value_selector:
                - guard
                - request
          outputs:
            request:
              type: string
