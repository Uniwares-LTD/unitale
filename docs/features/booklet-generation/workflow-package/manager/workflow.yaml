          code_language: python3
          code: |
            import json
            def unpack(raw):
                if isinstance(raw, str):
                    raw = json.loads(raw)
                if isinstance(raw, list):
                    if len(raw) != 1:
                        raise ValueError("Expected one explicit tool result, not an ambiguous wrapper")
                    raw = raw[0]
                if isinstance(raw, dict) and "result" in raw:
                    raw = raw["result"]
                    if isinstance(raw, str):
                        raw = json.loads(raw)
                if not isinstance(raw, dict) or raw.get("error") or raw.get("isError") or raw.get("ok") is False:
                    raise ValueError("Tool failed or result wrapper unsupported")
                return raw

            def main(raw, expected):
                saved = unpack(raw)
                checkpoint = json.loads(expected)
                if saved.get("checkpointVersion") != checkpoint["expectedVersion"] + 1:
                    raise ValueError("Result checkpoint not saved")
                return {"ok": True}
          variables:
            - variable: raw
              value_selector:
                - after
                - json
            - variable: expected
              value_selector:
                - consume
                - checkpoint
          outputs:
            ok:
              type: boolean
