          loop_id: actions
          provider_type: mcp
          provider_id: BOOKLET_MCP_BINDING_REQUIRED
          provider_name: BOOKLET_MCP_BINDING_REQUIRED
          tool_name: booklet_checkpoint_v2
          tool_label: booklet_checkpoint_v2
          tool_parameters:
            request:
              type: variable
