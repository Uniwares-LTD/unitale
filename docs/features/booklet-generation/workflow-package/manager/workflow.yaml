        parentId: actions
        extent: parent
        data:
          type: code
          title: dispatch-saved
          desc: ""
          selected: false
          isInLoop: true
          loop_id: actions
          code_language: python3
          code: |
            import json
            def unpack(raw):
                if isinstance(raw, str):
                    raw = json.loads(raw)
                if isinstance(raw, list):
                    if len(raw) != 1:
                        raise ValueError("Expected one explicit tool result, not an ambiguous wrapper")
                    raw = raw[0]
                if isinstance(raw, dict) and "result" in raw:
                    raw = raw["result"]
                    if isinstance(raw, str):
                        raw = json.loads(raw)
                if not isinstance(raw, dict) or raw.get("error") or raw.get("isError") or raw.get("ok") is False:
                    raise ValueError("Tool failed or result wrapper unsupported")
                return raw

            def main(raw, request):
                observed = unpack(raw)
                call = json.loads(request)
                if observed.get("callId") != call["callId"] or observed.get("requestHash") != call["requestHash"] or observed.get("status") != "dispatching":
                    raise ValueError("Dispatch not durably authorized/recorded")
                return {"ok": True}
          variables:
            - variable: raw
              value_selector:
                - dispatch
                - json
            - variable: request
              value_selector:
                - guard
                - dispatch
          outputs:
            ok:
              type: boolean
