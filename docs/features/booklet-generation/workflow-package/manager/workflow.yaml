          tool_configurations: {}
          tool_node_version: "2"
          retry_config:
            retry_enabled: false
            max_retries: 0
            retry_interval: 0
          error_strategy: fail-branch
      - id: saved
        type: custom
        position:
          x: 990
          y: 290
        parentId: actions
        extent: parent
        data:
          type: code
          title: saved
          desc: ""
          selected: false
          isInLoop: true
          loop_id: actions
          code_language: python3
          code: |
            import json
            def unpack(raw):
                if isinstance(raw, str):
                    raw = json.loads(raw)
                if isinstance(raw, list):
                    if len(raw) != 1:
                        raise ValueError("Expected one explicit tool result, not an ambiguous wrapper")
                    raw = raw[0]
                if isinstance(raw, dict) and "result" in raw:
                    raw = raw["result"]
                    if isinstance(raw, str):
                        raw = json.loads(raw)
                if not isinstance(raw, dict) or raw.get("error") or raw.get("isError") or raw.get("ok") is False:
                    raise ValueError("Tool failed or result wrapper unsupported")
                return raw

            def main(raw, context):
                saved = unpack(raw)
                c = json.loads(context)
                if saved.get("checkpointVersion") != c["checkpointVersion"] + 1:
                    raise ValueError("Checkpoint was not durably confirmed")
                return {"version": saved["checkpointVersion"]}
          variables:
            - variable: raw
              value_selector:
                - before
                - json
            - variable: context
              value_selector:
                - facts
                - context
          outputs:
            version:
              type: number
      - id: route
        type: custom
