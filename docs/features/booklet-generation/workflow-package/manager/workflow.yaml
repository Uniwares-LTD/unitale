      - id: consume
        type: custom
        position:
          x: 680
          y: 1550
        parentId: actions
        extent: parent
        data:
          type: code
          title: consume
          desc: ""
          selected: false
          isInLoop: true
          loop_id: actions
          code_language: python3
          code: |
            SERVICES = ["story-planner","manuscript","art-director","page-composer","image-executor","quality-reviewer"]
            import json
            def unpack(raw):
                if isinstance(raw, str):
                    raw = json.loads(raw)
                if isinstance(raw, list):
                    if len(raw) != 1:
                        raise ValueError("Expected one explicit tool result, not an ambiguous wrapper")
                    raw = raw[0]
                if isinstance(raw, dict) and "result" in raw:
                    raw = raw["result"]
                    if isinstance(raw, str):
                        raw = json.loads(raw)
                if not isinstance(raw, dict) or raw.get("error") or raw.get("isError") or raw.get("ok") is False:
                    raise ValueError("Tool failed or result wrapper unsupported")
                return raw

            def main(raw, action, request, context, version):
                result = unpack(raw)
                r = json.loads(request)
                c = unpack(context)
                if action in SERVICES and any(result.get(k) != r.get(k) for k in ("invocationId", "callId", "service", "operation")):
                    raise ValueError("Child result invocation mismatch")
                if action == "complete" and result.get("status") != "complete":
                    raise ValueError("Application did not confirm structural completion")
                if action == "request_human" and not all(result.get(k) for k in ("requestId", "presentationHash", "formContent")):
                    raise ValueError("Exact authenticated human presentation missing")
                form = result.get("formContent", "")
                if c["checkpointVersion"] != version:
                    raise ValueError("Checkpoint changed during external work; reconcile before applying")
                state = {**c.get("checkpoint", {}), "lastAction": action, "lastResult": result, "pending": None}
                checkpoint = {"expectedVersion": version, "fence": c["fence"], "state": state}
                if len(json.dumps(checkpoint, ensure_ascii=False).encode("utf-8")) > 65536:
                    raise ValueError("Retain oversized result through trusted observation/transfer before checkpoint; do not truncate")
                return {"checkpoint": json.dumps(checkpoint, ensure_ascii=False), "result": json.dumps({"status": "complete" if action == "complete" else "partial", "lastAction": action, "checkpointVersion": version + 1}), "done": action == "complete", "form": form}
          variables:
            - variable: raw
              value_selector:
                - action-result
                - output
            - variable: action
              value_selector:
                - guard
                - action
            - variable: request
              value_selector:
                - guard
                - request
            - variable: context
              value_selector:
                - after-context
                - json
            - variable: version
              value_selector:
                - saved
                - version
          outputs:
            checkpoint:
              type: string
            result:
              type: string
            done:
              type: boolean
            form:
              type: string
