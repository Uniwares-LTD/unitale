          selected: false
          code_language: python3
          code: |
            import json, hashlib
            def canonical(value):
                import math
                from decimal import Decimal
                if value is None:
                    return "null"
                if isinstance(value, bool):
                    return "true" if value else "false"
                if isinstance(value, str):
                    return json.dumps(value, ensure_ascii=False)
                if isinstance(value, (int, float)):
                    number = float(value)
                    if not math.isfinite(number):
                        raise ValueError("Non-finite JSON number")
                    if number == 0:
                        return "0"
                    negative = "-" if number < 0 else ""
                    absolute = abs(number)
                    decimal = Decimal(repr(absolute))
                    if 1e-6 <= absolute < 1e21:
                        text = format(decimal, "f")
                        return negative + (text.rstrip("0").rstrip(".") if "." in text else text)
                    digits = format(decimal.normalize(), "e").split("e")
                    exponent = int(digits[1])
                    return negative + digits[0] + "e" + ("+" if exponent >= 0 else "-") + str(abs(exponent))
                if isinstance(value, list):
                    return "[" + ",".join(canonical(x) for x in value) + "]"
                if isinstance(value, dict):
                    keys = sorted(value, key=lambda key: key.encode("utf-16-be"))
                    return "{" + ",".join(canonical(key) + ":" + canonical(value[key]) for key in keys) + "}"
                raise ValueError("Unsupported JSON value")
            def digest(value):
                return hashlib.sha256(canonical(value).encode("utf-8")).hexdigest()
            def identity(ref):
                return {k: v for k, v in ref.items() if k not in ("nativeFileId", "url")}
            def main(request, references=None, execution_ready="false"):
                r = json.loads(request)
                if len(request.encode("utf-8")) > 262144 or r.get("contractVersion") != 2 or r.get("service") != "image-executor":
                    raise ValueError("Invalid image request/version/capacity")
                if set(r) - {"contractVersion", "invocationId", "callId", "service", "operation", "intent", "items", "sources", "references", "constraints"}:
                    raise ValueError("Private/unsupported child fields")
                if not r.get("invocationId") or not r.get("callId") or r.get("intent") not in ("create", "revise"):
                    raise ValueError("Image invocation identity/intent required")
                if len(r.get("items", [])) != 1:
                    raise ValueError("Capacity: initial image workflow handles one explicitly scoped call; Manager may invoke again for independent items")
                item = r["items"][0]
                data = item["input"]
                refs = r.get("references", [])
                files = references or []
                if len(files) != len(refs) or len(refs) > 16:
                    raise ValueError("Original reference capacity/count mismatch")
                seen = set()
                for i, ref in enumerate(refs):
                    key = (ref["assetId"], ref["sha256"])
                    if not all(ref.get(k) for k in ("assetId", "sha256", "nativeFileId")) or type(ref.get("bytes")) is not int or not 0 < ref["bytes"] <= 8388608 or key in seen or ref.get("nativeFileId") not in (files[i].get("id"), files[i].get("related_id")):
                        raise ValueError("Duplicate/oversized/wrong ordered original")
                    seen.add(key)
                sources = [{k: s[k] for k in ("artifactId", "revisionId", "contentHash")} for s in r.get("sources", [])]
                if r["operation"] == "prepare":
                    if not sources or not all(data.get(k) for k in ("specification", "style", "settings", "imageKind")):
                        raise ValueError("Selected specification/style/settings/source identities required")
                    contents = [s.get("content") for s in r.get("sources", [])]
                    for source in r.get("sources", []):
                        if source.get("content") is None or digest(source["content"]) != source["contentHash"]:
                            raise ValueError("Image source content/hash mismatch")
                    if data["specification"] not in contents or data["style"] not in contents:
                        raise ValueError("Prepare requires exact selected specification/style content")
                    spec = data["specification"]
                    if data["style"].get("kind") != "style":
                        raise ValueError("Style source kind required")
                    if data["imageKind"] == "page":
                        layouts = [x for x in contents if x.get("kind") == "book-layout"]
                        if len(layouts) != 1 or spec.get("kind") != "page-spec":
                            raise ValueError("Selected page layout/specification required")
                        page = next((p for p in layouts[0]["pages"] if p["id"] == spec["pageId"]), None)
                        if page is None or len(page["panels"]) != len(spec["panels"]):
                            raise ValueError("Page not in selected layout")
                        for panel, baseline in zip(spec["panels"], page["panels"]):
                            if any(panel[k] != baseline[k] for k in ("id", "lettering", "noText")):
                                raise ValueError("Prepared page changed exact layout/lettering")
                        exact = [span for panel in spec["panels"] for span in panel["lettering"]]
                        if data.get("lettering", []) != exact or data["settings"]["canvas"] != layouts[0]["canvas"]:
                            raise ValueError("Prepared lettering/canvas differs from selected page")
                    elif spec.get("kind") != "image-spec" or data.get("lettering"):
                        raise ValueError("Reference/sample specification must not invent lettering")
                    settings = data["settings"]
                    if settings["mode"] != ("edit" if refs else "generate"):
                        raise ValueError("Generate/edit original mismatch")
                    prompt = "Illustrate the supplied specification. Metadata IDs are not visible lettering.\n"
                    prompt += "Immutable style:\n" + canonical(data["style"]) + "\nSpecification:\n" + canonical(data["specification"])
                    prompt += "\nOrdered original identities:\n" + canonical([identity(ref) for ref in refs])
                    lettering = data.get("lettering", [])
                    prompt += "\nRender only the following exact visible lettering, preserving Unicode and whitespace. No added labels or IDs.\n"
                    for text in lettering:
                        prompt += "Exact text begins:\n" + text["text"] + "\nExact text ends.\n"
                    if not lettering:
                        prompt += "No visible lettering or speech bubbles.\n"
                    prepared = {"callId": r["callId"], "imageKind": data["imageKind"], "prompt": prompt, "settings": settings, "sources": sources, "references": [identity(ref) for ref in refs]}
                    prepared["requestHash"] = digest(prepared)
                    result = {"contractVersion": 2, "invocationId": r["invocationId"], "callId": r["callId"], "service": r["service"], "operation": "prepare", "status": "succeeded", "items": [{"itemId": item["itemId"], "status": "succeeded", "prepared": prepared}]}
                    return {"route": "prepare", "result": canonical(result), "prompt": "", "model": "", "size": "", "count": 0, "quality": "", "background": "", "format": ""}
                if r["operation"] != "generate":
                    raise ValueError("Unsupported image operation")
                prepared = data["prepared"]
                if digest({k: v for k, v in prepared.items() if k != "requestHash"}) != prepared["requestHash"]:
                    raise ValueError("Prepared request changed")
                if prepared["callId"] != r["callId"] or prepared["sources"] != sources or prepared["references"] != [identity(ref) for ref in refs]:
                    raise ValueError("Prepared source/call/original identity changed")
                settings = prepared["settings"]
                if settings["mode"] != ("edit" if refs else "generate") or not 1 <= settings["count"] <= 10:
                    raise ValueError("Image mode/count mismatch")
                if execution_ready != "true":
                    raise ValueError("Activation blocked: no-retry/exact-model/native-file compatibility pending")
                if settings["model"] not in ("gpt-image-2", "gpt-image-2.5-flare", "gpt-image-2.5-sunburst"):
                    raise ValueError("Official tool does not accept the selected dated model; no silent substitution")
                width, height = settings["canvas"]["width"], settings["canvas"]["height"]
                if width % 16 or height % 16 or min(width, height) <= 0 or max(width, height) > 3840 or max(width, height) > 3 * min(width, height) or not 655360 <= width * height <= 8294400:
                    raise ValueError("Unsupported original canvas; do not resize")
                return {"route": settings["mode"], "result": "", "prompt": prepared["prompt"], "model": settings["model"], "size": str(width) + "x" + str(height), "count": settings["count"], "quality": settings["quality"], "background": settings["background"], "format": settings["format"]}
          variables:
            - variable: request
              value_selector:
                - start
                - request
            - variable: references
              value_selector:
                - start
                - references
            - variable: execution_ready
              value_selector:
                - env
                - execution_ready
          outputs:
            route:
              type: string
            result:
              type: string
            prompt:
