            import json
            def main(request, files=None, usage=None):
                r = json.loads(request)
                files = files or []
                count = r["items"][0]["input"]["prepared"]["settings"]["count"]
                if len(files) > count:
                    raise ValueError("Unexpected output images")
                status = "succeeded" if len(files) == count else ("partial" if files else "unknown")
                outputs = [{"outputKey": r["callId"] + ":" + str(i), "nativeFile": f} for i, f in enumerate(files)]
                result = {"contractVersion": 2, "invocationId": r["invocationId"], "callId": r["callId"], "service": r["service"], "operation": "generate", "status": status, "items": [{"itemId": r["items"][0]["itemId"], "status": status, "outputs": outputs}], "providerOutput": usage or [], "limitations": ["Provider output is not an application retention receipt or independently verified cost. Reconcile unknown/missing output slots before replay."]}
                return {"result": json.dumps(result, ensure_ascii=False)}
          variables:
