<text x="26" y="2082" font-size="23" fill="#172033" xml:space="preserve">References between documents (embedded objects have no separate boxes)</text>
<text x="26" y="2115" font-size="16" fill="#172033" xml:space="preserve">Revision request -&gt; Entitlement allocation: allocationIds[]</text>
<text x="26" y="2140" font-size="16" fill="#172033" xml:space="preserve">Quality review -&gt; Quality policy: policyRevisionId</text>
<text x="26" y="2165" font-size="16" fill="#172033" xml:space="preserve">Catalog head -&gt; Catalog version: publishedRevision</text>
<text x="26" y="2190" font-size="16" fill="#172033" xml:space="preserve">Billing intent -&gt; Catalog version: accepted purchase snapshot</text>
<text x="26" y="2215" font-size="16" fill="#172033" xml:space="preserve">Billing intent -&gt; Verified payment: verified payments and renewals</text>
<text x="26" y="2240" font-size="16" fill="#172033" xml:space="preserve">Verified payment -&gt; Credit lot: verified grant</text>
<text x="26" y="2265" font-size="16" fill="#172033" xml:space="preserve">Promotion reservation -&gt; Catalog version: promotion snapshot</text>
<text x="26" y="2290" font-size="16" fill="#172033" xml:space="preserve">Verified payment -&gt; Promotion reservation: finalizes redemption</text>
<text x="26" y="2315" font-size="16" fill="#172033" xml:space="preserve">Credit lot -&gt; Wallet: account identity</text>
<text x="26" y="2340" font-size="16" fill="#172033" xml:space="preserve">Credit reservation -&gt; Credit lot: allocations[].lotId</text>
<text x="26" y="2365" font-size="16" fill="#172033" xml:space="preserve">Ledger entry -&gt; Wallet: account audit trail</text>
<text x="26" y="2390" font-size="16" fill="#172033" xml:space="preserve">Consumption order -&gt; Catalog version: accepted consumption snapshot</text>
<text x="26" y="2415" font-size="16" fill="#172033" xml:space="preserve">Consumption order -&gt; Production: value.targetId</text>
<text x="26" y="2440" font-size="16" fill="#172033" xml:space="preserve">Entitlement allocation -&gt; Consumption order: orderId</text>
<text x="26" y="2465" font-size="16" fill="#172033" xml:space="preserve">Entitlement allocation -&gt; Production: subjectId resolves inside production</text>
<text x="26" y="2490" font-size="16" fill="#172033" xml:space="preserve">Consumption workflow -&gt; Consumption order: orderId</text>
<text x="26" y="2515" font-size="16" fill="#172033" xml:space="preserve">Consumption charge -&gt; Consumption order: orderId</text>
<text x="26" y="2540" font-size="16" fill="#172033" xml:space="preserve">Consumption charge -&gt; Ledger entry: ledgerId</text>
<text x="26" y="2565" font-size="16" fill="#172033" xml:space="preserve">Provider action -&gt; Catalog version: catalog publication identity</text>
<text x="26" y="2590" font-size="16" fill="#172033" xml:space="preserve">Production -&gt; Execution profile: snapshotted profile identity</text>
<text x="26" y="2635" font-size="16" fill="#172033" xml:space="preserve">Source: scripts/booklet-model-review-data.mjs | Guide: docs/features/booklet-generation/model.md</text></g></svg>
