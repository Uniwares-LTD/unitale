<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1762" viewBox="0 0 1880 1762" role="img" aria-labelledby="title description">
<title id="title">Booklet creative content: entities, fields and relationships</title>
<desc id="description">Proposed logical model, not an implemented database schema. Groups show the entities and review fields for this model view. A relationship register specifies cross-group links. Fixed dark text on light backgrounds avoids theme-dependent unreadable rows.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1880" height="1762" fill="#f1f5f9"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="48" fill="#0f172a" font-size="32" font-weight="700">Booklet creative content</text>
<text x="36" y="82" fill="#92400e" font-size="20" font-weight="700">PROPOSED DESIGN — under review, not a collection or migration specification</text>
<text x="36" y="112" fill="#172033" font-size="17" font-weight="400">PK = primary identity   FK = reference   ? = optional/nullable   [] = list   1:N arrows show one-to-many ownership</text>
<text x="36" y="138" fill="#172033" font-size="17" font-weight="400">T14: decide stable identities, typed payloads, ordering and revision granularity.</text>
<text x="36" y="180" fill="#0f172a" font-size="24" font-weight="700">1. Brief and story</text>
<text x="36" y="208" fill="#172033" font-size="17" font-weight="400">Nested creative content belongs to artifact revisions; boxes are not separate collection proposals.</text>
