<text x="1154" y="1369" fill="#172033" font-size="16" font-weight="400">Cover first; exact purchased pages</text>
<text x="36" y="1532" fill="#0f172a" font-size="24" font-weight="700">Cross-group relations and invariants</text>
<text x="36" y="1570" fill="#172033" font-size="16" font-weight="400">Production owns the brief; story, style and page content live in Artifact revisions.</text>
<text x="36" y="1605" fill="#172033" font-size="16" font-weight="400">Roster IDs identify Subjects; accepted-source references identify exact Revisions.</text>
<text x="36" y="1640" fill="#172033" font-size="16" font-weight="400">Manuscript units reference character/location Subjects; panels reference units.</text>
<text x="36" y="1675" fill="#172033" font-size="16" font-weight="400">Page plan 1 -&gt; many Panels; Panel 1 -&gt; many Lettering entries.</text>
<text x="966" y="1570" fill="#172033" font-size="16" font-weight="400">Reference and page-image Revisions attach immutable Original assets.</text>
<text x="966" y="1605" fill="#172033" font-size="16" font-weight="400">Manifest entries bind page Subjects to exact images and acceptance evidence.</text>
<text x="966" y="1640" fill="#172033" font-size="16" font-weight="400">Review D01-D04: subject identity, per-entity revisions, ordering, content bounds.</text>
<text x="966" y="1675" fill="#172033" font-size="16" font-weight="400">Raw generated envelopes remain evidence; retain structured content used by the app.</text>
