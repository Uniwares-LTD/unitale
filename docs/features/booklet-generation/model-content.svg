<text x="36" y="618" fill="#0f172a" font-size="24" font-weight="700">2. Entities and visual direction</text>
<text x="36" y="646" fill="#172033" font-size="17" font-weight="400">Individual descriptions and an explicit roster are proposals; current contracts store aggregate entity arrays.</text>
