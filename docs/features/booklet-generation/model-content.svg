<text x="36" y="1056" fill="#0f172a" font-size="24" font-weight="700">3. Physical pages and completion</text>
<text x="36" y="1084" fill="#172033" font-size="17" font-weight="400">Page order belongs to an ordered plan/manifest; page identity remains stable across revisions.</text>
