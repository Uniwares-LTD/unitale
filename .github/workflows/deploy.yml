name: "Release Unitale"
on:
  push:
    branches: [_staging, _prod]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, prod, production]
        required: true
permissions:
  contents: read
  packages: write
  actions: read
concurrency:
  group: ${{ github.repository }}-vps-operation
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.environment || (github.ref_name == '_prod' && 'production' || 'staging') }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read tracked environment configuration
        run: python3 scripts/deploy/environment.py "$TARGET" --github-env
      - name: Restore exact candidate on retry
        run: python3 scripts/deploy/candidate.py "$RUNNER_TEMP/release-candidate.json"
      - name: Guard, build, release and verify
        run: bash scripts/deploy/release.sh "$TARGET"
      - name: Retain immutable release candidate
        if: always() && env.CANDIDATE_RESTORED != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: ignore
          overwrite: false
      - name: Remove runner credentials
        if: always()
        run: |
          source scripts/deploy/identity.sh
          rm -rf "$RUNNER_TEMP/${project_slug}-access"
          docker logout ghcr.io || true
