name: "Provision environment"
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, prod, production]
        required: true
      apply:
        description: Legacy input retained for an explicit migration error
        type: boolean
        default: false
permissions: {}
jobs:
  owner-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Route initial installation to its owner
        run: |
          echo '::error::OWNER_ACTION_REQUIRED: use the guided staging-setup.py helper for the selected environment, then the reviewed Infrastructure bootstrap/controller installation. This workflow no longer uploads privileged scripts or provisions through the routine deployment key.'
          echo 'https://github.com/Uniwares-LTD/infrastructure/blob/main/docs/operations.md#approved-plan-operations'
          exit 2
