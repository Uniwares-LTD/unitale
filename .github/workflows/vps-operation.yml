name: "Unitale host operation"
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      action:
        type: string
        required: true
      apply:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-vps-operation
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      APPLY: ${{ inputs.apply }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read tracked environment configuration
        run: python3 scripts/deploy/environment.py "$TARGET" --github-env
      - name: Guard target and action
        run: |
          bash scripts/deploy/guard.sh "$TARGET"
          case "$ACTION" in check|rollback) ;; *) exit 1 ;; esac
          bash scripts/deploy/vps.sh "$ACTION" "$TARGET"
      - name: Configure pinned Access SSH
        if: inputs.apply
        run: bash scripts/deploy/access.sh
      - name: Apply requested operation
        if: inputs.apply
        run: |
          bash scripts/deploy/guard.sh "$TARGET"
          bash scripts/deploy/host-operation.sh "$ACTION" "$TARGET"
          printf 'Operation succeeded: action=%s environment=%s workflow-commit=%s\n' "$ACTION" "$TARGET" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner credentials
        if: always()
        env:
          OPERATION_STATUS: ${{ job.status }}
        run: |
          source scripts/deploy/identity.sh
          rm -rf "$RUNNER_TEMP/${project_slug}-access"
          case "$ACTION" in check|rollback) action=$ACTION ;; *) action=unknown ;; esac
          case "$TARGET" in staging|prod|production) target=$TARGET ;; *) target=unknown ;; esac
          printf 'Operation result=%s action=%s environment=%s workflow-commit=%s apply=%s\n' "$OPERATION_STATUS" "$action" "$target" "$GITHUB_SHA" "$APPLY" >> "$GITHUB_STEP_SUMMARY"
